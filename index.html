<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PakMaps 3D Demo</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #map { position: absolute; inset: 0; }
  #bar { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button { padding: 8px 12px; border: 0; border-radius: 8px; background: #fff; color:#000; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #status { position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 5; background: rgba(0,0,0,.8); color: #fff;
            padding: 10px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="map"></div>
<div id="status">Starting...</div>
<script>
const st = document.getElementById("status");
const log = m => { st.textContent += "\n" + m; };
window.onerror = (m) => log("JS error: " + m);

function loadScript(url) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = url; s.onload = ok; s.onerror = () => fail(new Error("blocked: " + url));
    document.head.appendChild(s);
  });
}
function loadCss(url) {
  const l = document.createElement("link"); l.rel = "stylesheet"; l.href = url; document.head.appendChild(l);
}

const PLACES = {
  "Faizabad": [73.0833, 33.6607],
  "Kashmir Hwy": [73.0590, 33.6930],
  "IJP Road": [73.0700, 33.6400],
  "Blue Area": [73.0930, 33.7100],
  "Saddar": [73.0430, 33.5960]
};

(async () => {
  const bases = ["https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/", "https://unpkg.com/maplibre-gl@4.7.1/dist/"];
  let loaded = false;
  for (const b of bases) {
    try { loadCss(b + "maplibre-gl.css"); await loadScript(b + "maplibre-gl.js"); loaded = true; break; }
    catch (e) { log(e.message); }
  }
  if (!loaded || typeof maplibregl === "undefined") {
    log("Map library could not load. Are you opening this from the Claude preview? Save the file and open it from Downloads.");
    return;
  }
  log("Library OK. Loading map...");
  try { await loadScript("https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"); }
  catch (e) { log("Turf not loaded, bridges disabled"); }
  fetch("https://tiles.openfreemap.org/planet").then(r => r.json()).then(j => {
    log("TileJSON OK");
    const u = j.tiles[0].replace("{z}", 14).replace("{x}", 11517).replace("{y}", 6563);
    return fetch(u).then(r => r.arrayBuffer().then(b => log("Test tile HTTP " + r.status + ", " + b.byteLength + " bytes")));
  }).catch(e => log("Network test FAILED: " + e.message));

  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: PLACES["Faizabad"], zoom: 16, pitch: 60, bearing: -20, maxPitch: 85
  });
  map.addControl(new maplibregl.NavigationControl());
  map.on("error", e => log("Map error: " + (e.error && e.error.message)));
  map.on("load", () => {
    log("Map loaded.");
    try {
      const style = map.getStyle();
      const src = Object.keys(style.sources).find(k => style.sources[k].type === "vector");
      const firstSymbol = style.layers.find(l => l.type === "symbol");
      style.layers.filter(l => l["source-layer"] === "building" && l.type !== "fill-extrusion")
                  .forEach(l => map.removeLayer(l.id));
      map.addLayer({
        id: "b3d", type: "fill-extrusion", source: src, "source-layer": "building", minzoom: 14,
        paint: {
          "fill-extrusion-color": "#cfc9bf",
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], 9],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-opacity": 0.92
        }
      }, firstSymbol && firstSymbol.id);
      log("3D buildings on.");
      map.addSource("bridges3d", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "bridges3d", type: "fill-extrusion", source: "bridges3d", minzoom: 15,
        paint: { "fill-extrusion-color": ["case", ["==", ["get", "pillar"], 1], "#b9b6ae", "#5b5b5f"],
                 "fill-extrusion-base": ["coalesce", ["get", "b"], 5],
                 "fill-extrusion-height": ["coalesce", ["get", "h"], 6.5],
                 "fill-extrusion-opacity": 0.97 }
      });
      map.addLayer({
        id: "tunnels-hl", type: "line", source: src, "source-layer": "transportation", minzoom: 14,
        filter: ["==", ["get", "brunnel"], "tunnel"],
        paint: { "line-color": "#1d4ed8", "line-width": 4, "line-dasharray": [2, 2], "line-opacity": 0.8 }
      });
      let timer;
      const nearSeam = (c) => {
        const n = 16384;
        const x = (c[0] + 180) / 360 * n;
        const la = c[1] * Math.PI / 180;
        const y = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n;
        const fx = x - Math.floor(x), fy = y - Math.floor(y);
        return fx < 0.06 || fx > 0.94 || fy < 0.06 || fy > 0.94;
      };
      const refresh = () => {
        if (typeof turf === "undefined" || map.getZoom() < 15) return;
        const seen = new Set(), out = [];
        const feats = map.querySourceFeatures(src, {
          sourceLayer: "transportation", filter: ["==", ["get", "brunnel"], "bridge"]
        });
        for (const f of feats) {
          if (!f.geometry || !/LineString/.test(f.geometry.type)) continue;
          const k = JSON.stringify(f.geometry.coordinates[0]) + f.geometry.coordinates.length;
          if (seen.has(k)) continue;
          seen.add(k);
          const c = f.properties.class;
          const w = (c === "motorway" || c === "trunk") ? 9 : (c === "primary" || c === "secondary") ? 7 : 5;
          try {
            let rs = 0, re = 0;
            if (f.geometry.type === "LineString") {
              const Lm = turf.length(f, { units: "meters" });
              const co = f.geometry.coordinates;
              rs = nearSeam(co[0]) ? 0 : Math.min(36, Lm / 3);
              re = nearSeam(co[co.length - 1]) ? 0 : Math.min(36, Lm / 3);
              const parts = [];
              if (rs) parts.push([0, rs / 2, 1.5, 2.8], [rs / 2, rs, 3.2, 4.6]);
              parts.push([rs, Lm - re, 5, 6.5]);
              if (re) parts.push([Lm - re, Lm - re / 2, 3.2, 4.6], [Lm - re / 2, Lm, 1.5, 2.8]);
              for (const [a, b, base, h] of parts) {
                if (b - a < 0.5) continue;
                const s = turf.lineSliceAlong(f, a, b, { units: "meters" });
                const q = turf.buffer(s, w / 2, { units: "meters" });
                if (q) { q.properties = { b: base, h: h, pillar: 0 }; out.push(q); }
              }
            } else {
              const p = turf.buffer(f, w / 2, { units: "meters" });
              if (p) { p.properties = { b: 5, h: 6.5, pillar: 0 }; out.push(p); }
            }
            if (f.geometry.type === "LineString") {
              const L = turf.length(f, { units: "meters" });
              for (let d = rs + 10; d < L - re - 5 && out.length < 1500; d += 22) {
                const pt = turf.along(f, d, { units: "meters" });
                const sq = turf.buffer(pt, 1.3, { units: "meters", steps: 4 });
                if (sq) { sq.properties = { b: 0, h: 5, pillar: 1 }; out.push(sq); }
              }
            }
          } catch (e) {}
          if (out.length > 1500) break;
        }
        map.getSource("bridges3d").setData({ type: "FeatureCollection", features: out });
      };
      map.on("moveend", () => { clearTimeout(timer); timer = setTimeout(refresh, 300); });
      map.once("idle", refresh);
      log("Bridge + tunnel layers ready.");

      // ---- Routing demo: tap start, tap destination, press Drive ----
      let pts = [], markers = [], route = null, driving = false;
      map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "route-line", type: "line", source: "route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#2563eb", "line-width": 7, "line-opacity": 0.85 }
      });
      const clearAll = () => {
        driving = false; pts = []; route = null;
        markers.forEach(m => m.remove()); markers = [];
        map.getSource("route").setData({ type: "FeatureCollection", features: [] });
      };
      map.on("click", async (e) => {
        if (driving) return;
        if (pts.length >= 2) clearAll();
        pts.push([e.lngLat.lng, e.lngLat.lat]);
        markers.push(new maplibregl.Marker({ color: pts.length === 1 ? "#16a34a" : "#dc2626" })
          .setLngLat(pts[pts.length - 1]).addTo(map));
        st.style.display = "block";
        if (pts.length === 1) { st.textContent = "Start set. Tap the map again for the destination."; return; }
        st.textContent = "Finding route...";
        try {
          const u = "https://router.project-osrm.org/route/v1/driving/" + pts[0].join(",") + ";" +
                    pts[1].join(",") + "?overview=full&geometries=geojson";
          const r = await (await fetch(u)).json();
          if (!r.routes || !r.routes.length) throw new Error(r.code || "no route found");
          route = r.routes[0].geometry;
          map.getSource("route").setData({ type: "Feature", geometry: route });
          st.textContent = "Route: " + (r.routes[0].distance / 1000).toFixed(1) + " km, about " +
                           Math.round(r.routes[0].duration / 60) + " min. Tap Drive.";
        } catch (err) { st.textContent = "Routing failed: " + err.message; }
      });
      const mk = (label, fn) => {
        const b = document.createElement("button"); b.textContent = label; b.onclick = fn;
        document.getElementById("bar").appendChild(b);
      };
      mk("Drive", () => {
        if (!route || driving) return;
        driving = true; st.style.display = "none";
        const line = { type: "Feature", geometry: route };
        const total = turf.length(line, { units: "meters" });
        let d = 0, last = performance.now(), lastRefresh = 0, brg = null;
        const step = (now) => {
          if (!driving) return;
          d += 35 * ((now - last) / 1000); last = now;   // 35 m/s demo speed
          if (d >= total) { driving = false; return; }
          const a = turf.along(line, d, { units: "meters" }).geometry.coordinates;
          const b = turf.along(line, Math.min(d + 40, total), { units: "meters" }).geometry.coordinates;
          const target = turf.bearing(a, b);
          if (brg === null) brg = target;
          brg += (((target - brg + 540) % 360) - 180) * 0.1;
          map.jumpTo({ center: a, bearing: brg, pitch: 72, zoom: 17.3 });
          if (now - lastRefresh > 1500) { lastRefresh = now; refresh(); }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
      mk("Clear", clearAll);
      log("Tap map: start, then destination.");
    } catch (e) { log("3D error: " + e.message); }

  });
  const bar = document.getElementById("bar");
  Object.entries(PLACES).forEach(([n, c]) => {
    const b = document.createElement("button"); b.textContent = n;
    b.onclick = () => map.flyTo({ center: c, zoom: 16.5, pitch: 60, bearing: -20, duration: 2500 });
    bar.appendChild(b);
  });
})();
</script>
</body>
</html>
